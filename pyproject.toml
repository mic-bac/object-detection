[project]
name = "object-detection"
version = "0.1.0"
description = "Object-detection teaching examples (YOLO / ultralytics)."
requires-python = ">=3.13"
dependencies = [
    "pandas",
    "ultralytics",  # pulls in torch + opencv from PyPI (large download)
]

[dependency-groups]
dev = [
    "black",
    "pytest",
    "ipykernel",
]

[tool.uv]
package = false
